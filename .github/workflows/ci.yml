name: Quest checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUEST_DB_PASSWORD: isolated-ci-fixture
      QUEST_DB_PORT: "5547"
      QUEST_PORT: "8017"
      QUEST_TEST_DB_PASSWORD: isolated-ci-fixture
      QUEST_TEST_DB_PORT: "5547"
      QUEST_E2E_URL: http://127.0.0.1:8017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --require-hashes -r runner/requirements.lock
          python -m pip install --no-build-isolation --no-deps ./runner
          python -m pip check
      - run: |
          PYTHONPATH=backend python -m app.domain.content
          python -m ruff check backend runner scripts curriculum
          python -m mypy backend/app backend/migrations runner/quest_runner
          python -m pytest -m 'not integration'
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npx playwright install --with-deps chromium
      - run: docker compose -p quest-ci up --build --wait -d
      - run: python -m pytest -m integration
      - working-directory: frontend
        run: QUEST_E2E_FIXTURE=1 npm run e2e -- --grep 'M0 in the browser'
      - run: |
          docker compose -p quest-ci stop
          docker compose -p quest-ci up --wait -d
      - working-directory: frontend
        run: QUEST_E2E_RESTART=1 npm run e2e -- --grep 'survives a container restart'
      - run: |
          docker compose -p quest-ci stop
          docker tag quest-ci-quest:latest quest-map-ci-quest:latest
          docker compose -p quest-map-ci up --no-build --wait -d
      - working-directory: frontend
        run: QUEST_E2E_MAP=1 npm run e2e -- world-map.spec.ts
      - if: always()
        run: |
          docker compose -p quest-ci down
          docker compose -p quest-map-ci down
