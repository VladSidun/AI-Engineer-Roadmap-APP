[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "quest_runner"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend:runner"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["backend", "runner"]
testpaths = ["backend/tests", "runner/tests"]
addopts = "-ra"
markers = ["integration: requires the isolated PostgreSQL fixture database"]
